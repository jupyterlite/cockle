codecov:
  notify:
    after_n_builds: 2

comment:
  after_n_builds: 2

flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    - name: unit
      paths:
        - src/
    - name: integration
      paths:
        - src/

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
